name: Japan — MEXT accredited institutions

# Weekly. The register gains roughly 35 institutions a year, so a daily check
# would find nothing 360 days out of 365 — and a schedule that almost never
# finds anything trains you to stop reading its output.
#
# Accreditation decisions are published in batches, so a weekly pass catches
# each cohort within days without pestering a small government portal.

on:
  schedule:
    - cron: "23 6 * * 1"      # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: jp-mext
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest
        run: |
          set -o pipefail
          python scripts/jp_ingest.py --latest 2>&1 | tee run.log

      - name: Publish JSON endpoints
        if: success()
        run: python scripts/publish.py --source jp-mext

      - name: Commit snapshot
        if: success()
        run: |
          if [ -z "$(git status --porcelain data public)" ]; then
            echo "No change — the register is unchanged since last week."
            exit 0
          fi
          git config user.name  "studiesmultiverse-bot"
          git config user.email "bot@studiesmultiverse.com"
          git add data public
          git commit -q -m "MEXT accredited institutions $(date -u +%Y-%m-%d)" \
                        -m "$(tail -n 15 run.log)"
          git pull --rebase -q origin main || true
          git push -q

      - name: Raise alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('run.log', 'utf8').slice(-6000); } catch (e) {}
            const body = [
              'The Japanese MEXT ingest failed. **Nothing was published — the previous snapshot still stands.**',
              '',
              'Two failures are worth telling apart here. If the log says the fetch was incomplete,',
              'the register outgrew a single API page and the ingest refused rather than archive a',
              'partial list — raise `per_page` or add pagination. If the API returned an empty array,',
              'the parameter set is no longer accepted: this endpoint answers 200 with zero rows when',
              'its filters are wrong, which looks exactly like a register with no institutions in it.',
              '',
              '```', log || '(no log captured)', '```',
              '',
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ingest-failure',
            })).data.find(i => i.title.startsWith('MEXT ingest'));
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `MEXT ingest failed — ${new Date().toISOString().slice(0,10)}`,
                body, labels: ['ingest-failure', 'japan'] });
            }
