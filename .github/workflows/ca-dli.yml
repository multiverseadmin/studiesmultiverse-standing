name: Canada — designated learning institutions

# IRCC updates this page in real time when a school is added, suspended or
# delisted, and publishes no notice when it does. Daily is the right cadence:
# the only public signal is that a row stopped being there.

on:
  schedule:
    - cron: "41 5 * * *"      # 05:41 UTC daily
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reconstruct history from Internet Archive captures"
        type: boolean
        default: false
      limit:
        description: "Captures per backfill run (0 = all; the archive is slow, so batches are kinder)"
        type: string
        default: "150"

permissions:
  contents: write
  issues: write

concurrency:
  group: ca-dli
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest and commit incrementally
        run: |
          set -o pipefail
          git config user.name  "studiesmultiverse-bot"
          git config user.email "bot@studiesmultiverse.com"

          # A push can lose a race, and losing one must not cost two hours.
          #
          # This run died at 45 minutes with 28 editions already safely
          # committed. The python ingest had just printed "9 ingested" — the
          # failure was underneath, in git: something else pushed to main
          # between our commit and our push, the rebase was swallowed by
          # `|| true`, the push was rejected, and because that was the last
          # command in the function the whole step exited non-zero.
          #
          # The other writer that day was a human pushing unrelated files, but
          # it does not matter who: there are four ingest workflows now and two
          # of them run daily, so the race is permanent. Retry it, and let a
          # commit that cannot be pushed ride along with the next batch — it is
          # already committed locally and nothing is lost by waiting.
          #
          # A persistent failure must still be loud, so the flag is checked once
          # at the end rather than forgiven silently.
          PUSH_FAILED=0

          save() {
            python scripts/publish.py --source ca-dli || true
            if [ -z "$(git status --porcelain data public)" ]; then
              echo "  nothing new to commit ($1)"
              return 0
            fi
            git add data public
            git commit -q -m "DLI list snapshot $(date -u +%Y-%m-%dT%H:%M) ($1)" \
                          -m "$(tail -n 15 run.log)"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -q origin main && git push -q; then
                echo "  committed: $1"
                PUSH_FAILED=0
                return 0
              fi
              echo "  push attempt $attempt lost a race; retrying"
              git rebase --abort 2>/dev/null || true
              sleep $(( attempt * 5 ))
            done
            echo "  could not push after 5 attempts — the commit is local and the next save will carry it"
            PUSH_FAILED=1
            return 0
          }

          if [ "${{ inputs.backfill }}" != "true" ]; then
            python scripts/ca_ingest.py --latest 2>&1 | tee run.log
            save "daily"
            exit 0
          fi

          # Backfill in batches, committing after each one.
          #
          # The first attempt at this ran 150 captures and committed once, at the
          # very end. The Internet Archive started timing out partway through, the
          # step died, and roughly a hundred already-ingested editions were thrown
          # away with it. Long jobs against a free, heavily-loaded service WILL be
          # interrupted; the only question is whether the work survives it.
          #
          # Batches of 10 mean a failure costs at most 10 captures, and every
          # completed batch is already safe in the repository. Sized down from
          # 25 once the archive was measured serving roughly one capture every
          # 50 seconds — at that rate a batch of 25 is 20 minutes of exposure
          # between saves.
          TOTAL="${{ inputs.limit }}"
          BATCH=10
          DONE=0
          PROGRESS=0
          : > run.log
          while [ "$DONE" -lt "$TOTAL" ]; do
            echo "=== batch starting at $DONE of $TOTAL ==="
            if python scripts/ca_ingest.py --backfill --limit "$BATCH" --sleep 2 2>&1 | tee -a run.log; then
              PROGRESS=1
            else
              echo "batch failed"
              save "partial after $DONE"
              # Only forgive the failure if earlier batches actually achieved
              # something. A run that got nowhere must fail loudly — reporting
              # success for zero work is how a broken pipeline stays broken.
              if [ "$PROGRESS" -eq 1 ]; then
                echo "earlier batches succeeded; stopping here and resuming next run"
                exit 0
              fi
              echo "no progress at all — failing so the alert fires"
              exit 1
            fi
            DONE=$((DONE + BATCH))
            save "$DONE of $TOTAL"
            # If the script found nothing new to do, stop early.
            if grep -q "nothing to do\|ingesting 0 capture" run.log; then
              echo "archive exhausted"
              break
            fi
          done

          # One last attempt, then say so plainly. Work that never reached the
          # remote is work nobody can see, and reporting success for it is how a
          # broken pipeline stays broken.
          if [ "$PUSH_FAILED" -eq 1 ]; then
            echo "retrying the outstanding push before finishing"
            save "final"
          fi
          if [ "$PUSH_FAILED" -eq 1 ]; then
            echo "FATAL: ingested editions are committed locally but could not be pushed"
            exit 1
          fi

      - name: Raise alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('run.log', 'utf8').slice(-6000); } catch (e) {}
            const body = [
              'The Canadian DLI ingest failed. **Nothing was published — the previous snapshot still stands.**',
              '',
              'If this was the sanity gate, that is the gate working. Open the source by hand before',
              'changing any threshold. Note that IRCC gives no notice of changes, so a large step is',
              'not automatically wrong — but it is not automatically right either.',
              '',
              '```', log || '(no log captured)', '```',
              '',
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ingest-failure',
            })).data.find(i => i.title.startsWith('DLI ingest'));
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `DLI ingest failed — ${new Date().toISOString().slice(0,10)}`,
                body, labels: ['ingest-failure', 'canada'] });
            }
